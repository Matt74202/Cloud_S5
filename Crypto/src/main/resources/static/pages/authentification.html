<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="../js/app.js"></script>
</head>
<body ng-app="myApp" ng-controller="AuthController">
    
    <form class="form" id="formAuth" ng-submit="submitForm()">
        <p id="heading">Insérez le PIN envoyé par mail</p>
        <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M3 0a1 1 0 0 1 1 1v1h8V1a1 1 0 0 1 2 0v1h1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-1v1a1 1 0 0 1-2 0v-1H4v1a1 1 0 0 1-2 0v-1H1a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h1V1a1 1 0 0 1 1-1zm10 10V7H9v3h4zm-5 0V7H4v3h4zM4 12v2h4v-2H4zm5 0v2h4v-2H9zM1 6h14V4H1v2z"/>
            </svg>
            <input type="text" class="input-field" ng-model="formData.pin" required placeholder="ex: 0000">
        </div>
        <button type="submit" class="button3" ng-click="submitForm()">Verifier</button>
    </form>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
