<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
    <script src="./js/app.js"> </script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../assets/js/app.js"> </script>
</head>
<body ng-app="myApp" ng-controller="AuthController">

    
    <div class="login-card col-md-4">
        <h4 class="text-auth">Insérez le pin recu par mail</h4>
        <div class="auth-form">
            <form ng-submit="submitForm()">
                <div class="form-group">
                    <input type="text" class="form-control" ng-model="formData.pin" required placeholder="ex: 0000">
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary w-100">Envoyer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
