<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../js/CoursController.js"></script>
    <title>Cours</title>
</head>
<body ng-controller="CoursController">
    <div id="menu-container"></div>

    <h1 class="titre">Cours en temps reel</h1>
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-6" ng-repeat="crypto in cryptos">
                <div class="crypto-box">
                    <div class="crypto-name">{{ crypto.nom }}</div>
                    <div class="crypto-price" id="bitcoin">${{ crypto.valeur | number:2 }}</div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../menu.html')
            .then(response => response.text())
            .then(data => {
                var menuContainer = document.getElementById('menu-container');
                menuContainer.innerHTML = data;

                var $scope = angular.element(menuContainer).scope();
                angular.element(menuContainer).injector().get('$compile')(menuContainer)($scope);

                $scope.$digest();
            });
    </script>
</body>
</html>
