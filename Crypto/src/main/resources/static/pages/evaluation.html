<!DOCTYPE html>
<html lang="en" ng-app="cryptoApp" ng-controller="cryptoController">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <title>Evaluation</title>
</head>
<body>
    <div id="menu-container"></div>

    <h1 class="titre">Evaluation Graphique</h1>

    <!-- Filter Section -->
    <div class="filter-container">
        <div class="crypto-box text-center">
            <select class="form-select" id="crypto-select" style="width: 300px; margin-bottom: 10px;">
                <option value="bitcoin">Bitcoin</option>
                <option value="ethereum">Ethereum</option>
                <option value="ripple">Ripple</option>
                <option value="litecoin">Litecoin</option>
                <option value="chainlink">Chainlink</option>
                <option value="cardano">Cardano</option>
                <option value="polkadot">Polkadot</option>
                <option value="stellar">Stellar</option>
                <option value="dogecoin">Dogecoin</option>
                <option value="solana">Solana</option>
            </select>
            <button class="evaluation-btn btn mt-3" ng-click="showChart()">Afficher Graphique</button>
        </div>
    </div>

    <!-- Chart Section -->
    <div class="row justify-content-center mt-4" ng-show="chartVisible">
        <div class="col-md-8">
            <canvas id="crypto-chart"></canvas>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        angular.module('cryptoApp', [])
        .controller('cryptoController', function($scope) {
            $scope.chartVisible = false;
            $scope.selectedCrypto = 'bitcoin';
            let currentChart = null;

            $scope.showChart = function() {
                $scope.chartVisible = true;
                
                // Générer données
                const labels = [];
                const prices = [];
                const today = new Date();
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    labels.push(date.toLocaleDateString());
                    prices.push(Math.random() * (1000 - 100) + 100);
                }

                // Détruire l'ancien graphique si existe
                if (currentChart) {
                    currentChart.destroy();
                }

                // Créer nouveau graphique
                const ctx = document.getElementById('crypto-chart').getContext('2d');
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Prix (USD)',
                            data: prices,
                            backgroundColor: 'rgba(255, 204, 0, 0.2)',
                            borderColor: '#ffcc00',
                            borderWidth: 2,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            };
        });
    </script>

    <!-- Bootstrap Bundle Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Load Menu -->
    <script>
        fetch('../menu.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('menu-container').innerHTML = data;
        });
    </script>
</body>
</html>
