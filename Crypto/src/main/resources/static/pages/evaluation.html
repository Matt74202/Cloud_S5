<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../js/EvolutionController.js"></script>
    <title>Evaluation</title>
</head>

<body ng-controller="EvolutionController">
    <div id="menu-container"></div>

    <h1 class="titre">Evaluation Graphique</h1>

    <!-- Filter Section -->
    <div class="filter-container">
        <div class="crypto-box text-center">
            <select class="form-select" id="crypto-select" style="width: 300px; margin-bottom: 10px;" ng-model="idCrypto">
                <option ng-repeat="crypto in cryptos" ng-value="crypto.id">{{ crypto.nom }}</option>
            </select>
            <button class="evaluation-btn btn mt-3" ng-click="showChart()">Afficher Graphique</button>
        </div>
    </div>

    <!-- Chart Section -->
    <div class="row justify-content-center mt-4" ng-show="chartVisible">
        <div class="col-md-8">
            <canvas id="crypto-chart"></canvas>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap Bundle Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Load Menu -->
    <script>
        fetch('../menu.html')
            .then(response => response.text())
            .then(data => {
                var menuContainer = document.getElementById('menu-container');
                menuContainer.innerHTML = data;

                var $scope = angular.element(menuContainer).scope();
                angular.element(menuContainer).injector().get('$compile')(menuContainer)($scope);

                $scope.$digest();
            });
    </script>
</body>
</html>
