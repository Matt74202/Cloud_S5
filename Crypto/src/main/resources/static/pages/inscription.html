<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
    <script src="../js/app.js"> </script>
</head>
<body ng-app="myApp" ng-controller="InscriptionController">
    <div class="login-card col-md-4">
        <h3>Inscription</h3>
        <form ng-submit="submitForm()">
            <div class="mb-3">
                <label for="username" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" ng-model="formData.nom" placeholder="ex: Cristiano Ronaldo">
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" ng-model="formData.email" placeholder="ex: username@gmail.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" ng-model="formData.mdp" placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css"></script>
</body>
</html>
