<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../js/MouvementController.js"></script>

    <title>Liste Mouvement</title>
</head>
<body ng-controller="MouvementController">
    <div id="menu-container"></div>

    <form action="./MouvementServlet" method="get">
        <div class="recherche-produits row g-3" id="contenu">
            <div class="col-md-3" id="input-recherche">
                <label style="color: white;">Date max: </label>
                <input type="date" placeholder="date1" name="date2" class="form-control">
            </div>

            <div class="col-md-3" id="input-recherche" style="padding-top: 30px;">
                <button type="submit" class="btn btn-primary">Filtrer</button>
            </div>
        </div>
    </form>

    

    <div class="tableau">
        <table class="table table">
            <thead>
                <tr>
                    <th scope="col">Utilisateur</th>
                    <th scope="col">Total Achat</th>
                    <th scope="col">Total Vente</th>
                    <th scope="col">Valeur portefeuille</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="trans in transactions">
                    <td>{{ trans.user.nom }}</td>
                    <td>{{ trans.totalAchat | currency }}</td>
                    <td>{{ trans.totalVente | currency }}</td>
                    <td>{{ trans.valeurPortefeuille | currency }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../menu.html')
            .then(response => response.text())
            .then(data => {
                var menuContainer = document.getElementById('menu-container');
                menuContainer.innerHTML = data;

                var $scope = angular.element(menuContainer).scope();
                angular.element(menuContainer).injector().get('$compile')(menuContainer)($scope);

                $scope.$digest();
            });
    </script>
</body>
</html>
