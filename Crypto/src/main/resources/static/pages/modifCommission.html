<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">

    <title>Modification Commission</title>
</head>
<body>
    <div id="menu-container"></div>

    <div class="form-container">
        <form class="formulaire col-6" action="./InsertMouvementServlet" method="post">
            <h1 class="h3 mb-3 fw-normal"> Modification de la commission </h1>
            
            <div class="form-floating">
                <input type="number" class="form-control" id="floatingMontant" placeholder="montant" name="achat" value="10">
                <label for="floatingMontant">Pourcentage achat </label>
            </div>

            <div class="form-floating">
                <input type="number" class="form-control" id="floatingMontant" placeholder="montant" name="vente" value="10">
                <label for="floatingMontant">Pourcentage vente </label>
            </div>


            <button class="w-100 btn btn-lg btn-primary" type="submit">Modifier</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../menu.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('menu-container').innerHTML = data;
        });
    </script>
</body>
</html>
