<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../js/ProfilController.js"></script>
    <title>Profil</title>
</head>
<body ng-controller="ProfilController">
    <div id="menu-container"></div>

    <div class="container">
        <div class="box">
            <h2>Fond</h2>
            <p class="fond-solde">Solde: ${{ fond.solde }}</p>
        </div>

        <div class="box portfolio">
            <div class="crypto-header">
                <h2>Cryptomonnaie</h2>
                <select id="cryptoFilter" ng-model="selectedCrypto" ng-change="filterCrypto()">
                    <option ng-value="0" selected>Toutes les cryptomonnaies</option>
                    <option ng-repeat="crypto in cryptos" ng-value="crypto.id">
                        {{crypto.nom}}
                    </option>
                </select>
            </div>

            <div ng-if="filteredPortefeuilles.length > 0">
                <p ng-repeat="portefeuille in filteredPortefeuilles">
                    {{ portefeuille.crypto.nom }} : ${{ portefeuille.solde * portefeuille.crypto.valeur | number:2 }}
                </p>
            </div>

            <div ng-if="filteredPortefeuilles.length === 0">
                <p>Aucun portefeuille trouvé pour cette cryptomonnaie.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('../menu.html')
            .then(response => response.text())
            .then(data => {
                var menuContainer = document.getElementById('menu-container');
                menuContainer.innerHTML = data;

                var $scope = angular.element(menuContainer).scope();
                angular.element(menuContainer).injector().get('$compile')(menuContainer)($scope);

                $scope.$digest();
            });
    </script>

</body>
</html>
