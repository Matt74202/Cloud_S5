<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
    <title>Profil</title>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="box">
            <h2>Fond</h2>
            <p class="fond-solde">Solde: $10,000</p>
        </div>

        <!-- Portfolio Section -->
        <div class="box portfolio">
            <div class="crypto-header">
                <h2>Cryptomonnaie</h2>

                <!-- Filtre select -->
                <select id="cryptoFilter" onchange="filterCrypto()">
                    <option value="all">Toutes les cryptomonnaies</option>
                    <option value="Bitcoin">Bitcoin (BTC)</option>
                    <option value="Ethereum">Ethereum (ETH)</option>
                    <option value="Cardano">Cardano (ADA)</option>
                    <option value="Solana">Solana (SOL)</option>
                    <option value="Ripple">Ripple (XRP)</option>
                </select>
            </div>

            <!-- Liste de cryptomonnaies -->
            <div id="cryptoList">
                <p data-crypto="Bitcoin">Bitcoin (BTC): 0.5 BTC</p>
                <p data-crypto="Ethereum">Ethereum (ETH): 3 ETH</p>
                <p data-crypto="Cardano">Cardano (ADA): 1000 ADA</p>
                <p data-crypto="Solana">Solana (SOL): 200 SOL</p>
                <p data-crypto="Ripple">Ripple (XRP): 500 XRP</p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../menu.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('menu-container').innerHTML = data;
        });
    </script>
</body>
</html>
