<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/contenu.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">

    <title>Transaction</title>
</head>
<body>
    <div id="menu-container"></div>

    <div class="form-container">
        <form class="formulaire col-6" action="./InsertMouvementServlet" method="post">
            <h1 class="h3 mb-3 fw-normal"> Depot/ Vente de fond </h1>
            
            <div class="form-floating">
                <select name="type" id="floatingMontant" class="form-control">
                    <option>Depot</option>
                    <option>Retrait</option>
                </select>
                <label for="floatingType">Type de mouvement </label>
            </div>
            
            <div class="form-floating">
                <input type="number" class="form-control" id="floatingMontant" placeholder="montant" name="montant">
                <label for="floatingMontant">Montant </label>
            </div>

            <div class="form-floating">
                <input type="date" class="form-control" id="floatingDate" placeholder="Password" name="date">
                <label for="floatingDate">Date du mouvement</label>
            </div>


            <button class="w-100 btn btn-lg btn-primary" type="submit">Ins&eacute;rer</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../menu.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('menu-container').innerHTML = data;
        });
    </script>
</body>
</html>
