# config/packages/nelmio_cors.yaml
nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: ['http://localhost:8088']
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS'] # ← Ajouter OPTIONS
        max_age: 3600
    paths:
        '^/api':
            allow_origin: ['http://localhost:8088']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS'] # ← Ajouter ici aussi
            allow_credentials: true