<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code PIN</title>
    <!-- Lien vers Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJv3+MQE2w5bNGUwCzRXYC3k1ke5NfEXyZtLl0EOV2jjwOpgI6UMCzBdX7AX" crossorigin="anonymous">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .pin-container {
            display: flex;
            justify-content: center;
            gap: 15px; /* Espacement entre les carrés */
            margin-top: 30px;
        }

        .pin-box {
            width: 50px;
            height: 50px;
            border: 2px solid white;
            border-radius: 5px; /* Coins légèrement arrondis */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .countdown {
            margin-top: 20px;
            font-size: 1.2em;
        }

        .text-div {
            margin-top: 30px;
            font-size: 1.2em;
            color: #00bcd4;
            padding: 15px;
            border: 2px solid #00bcd4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Votre Code PIN</h1>
        <p>Veuillez utiliser le code PIN ci-dessous pour vérifier votre identité :</p>
        <!-- <div class="pin-container">
            {% for digit in pinArray %}
                <div class="pin-box">{{ digit }}</div>
            {% endfor %}
        </div> -->
        <!-- <div class="pin-container">
            <div class="pin-box">1</div>
        </div> -->
        <p>{{pin}}</p>
        <p class="countdown">Le code expirera dans <span id="timer">10:00</span>.</p>
        <div class="text-div">
            <p>Inserez directement ce code pin dans le formulaire </p>
        </div>
        <div class="text-div">
            <p>Ou cliquez directement sur ce lien</p>
            <p><a href="{{validationLink}}">Valider mon login</a></p>
        </div>
    </div>
    <script>
        let countdownTime = 600;
        function updateCountdown() {
            const timerElement = document.getElementById("timer");
            const minutes = Math.floor(countdownTime / 60);
            const seconds = countdownTime % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (countdownTime > 0) {
                countdownTime--;
            } else {
                timerElement.textContent = "Expiré";
                clearInterval(countdownInterval);
            }
        }
        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0v8FqCk+8iXy2+7OoUqOe39syzz8M0dDkhkCXdoN+cdE+QdR" crossorigin="anonymous"></script>
</body>
</html>
