<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
  
    <!-- Lien vers Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJv3+MQE2w5bNGUwCzRXYC3k1ke5NfEXyZtLl0EOV2jjwOpgI6UMCzBdX7AX" crossorigin="anonymous">
    <style>
        /* Style personnalisé */
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        .container {
            border: 2px solid white; /* Bordure carrée blanche */
            border-radius: 10px; /* Coins arrondis */
            padding: 30px;
            background-color: black;
            max-width: 500px; /* Largeur maximale */
            margin: 0 auto; /* Centrage horizontal */
            color: white;
        }

        h1 {
            font-size: 2em;
        }

        p {
            font-size: 1.2em;
        }

        a {
            color: #00bcd4; /* Couleur bleue du lien */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container text-center">
      <p>Plus de trois tentatives ont ete effectue provenant de votre compte</p>
        <p>Est ce vraiment vous ? Pour reinitialiser vos tentatives , cliquez sur ce lien :</p>
        <p><a href="{{validationLink}}">Reinitialiser mes tentatives</a></p>
    </div>

    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0v8FqCk+8iXy2+7OoUqOe39syzz8M0dDkhkCXdoN+cdE+QdR" crossorigin="anonymous"></script>
</body>
</html>
